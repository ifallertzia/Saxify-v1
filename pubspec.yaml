name: sidify
description: Sidify — Stream beyond limits. A neon YouTube-powered music app.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Playback engine (UNCHANGED behaviour, only re-homed into services) ---
  just_audio: ^0.9.40
  youtube_explode_dart: ^3.1.0

  # --- Frontend only ---
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1

  # --- Phase 2: in-app updates ---
  package_info_plus: ^8.0.0
  http: ^1.2.0
  path_provider: ^2.1.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
