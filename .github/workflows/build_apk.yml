name: Build Flutter APK

on:
  push:
    branches: [ main, master, arena/01a0be80-sidify-app ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 21 required by AGP 9.x / Gradle 9.x used in this project's template
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # Latest stable Flutter — matches the project's Android template
      # (AGP 9.1.0, Gradle 9.3.1, Kotlin 2.4.0 require a recent Flutter)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors only, infos non-fatal)
        run: flutter analyze --no-fatal-infos

      - name: Build APK (release)
        shell: bash
        run: set -o pipefail && flutter build apk --release 2>&1 | tee build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build App Bundle (Play Store)
        shell: bash
        run: set -o pipefail && flutter build appbundle --release 2>&1 | tee appbundle.log

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Debugging aid: post the tail of the failed build log as a PR comment
      - name: Post build failure log to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "**❌ Build failed on commit ${{ github.sha }}**"
            echo '```'
            tail -120 build.log 2>/dev/null || echo "build.log missing"
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
