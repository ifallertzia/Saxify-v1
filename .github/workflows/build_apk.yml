name: Build Flutter APK

on:
  push:
    branches: [ main, master, arena/01a0be80-sidify-app ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 21 required by AGP 9.x / Gradle 9.x used in this project's template
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # Latest stable Flutter — matches the project's Android template
      # (AGP 9.1.0, Gradle 9.3.1, Kotlin 2.4.0 require a recent Flutter)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors only, infos non-fatal)
        run: flutter analyze --no-fatal-infos

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build App Bundle (Play Store)
        run: flutter build appbundle --release

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
